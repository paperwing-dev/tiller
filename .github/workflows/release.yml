name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.repository == 'paperwing-dev/tiller' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Mint release token
        id: release-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TILLER_RELEASE_APP_ID }}
          private-key: ${{ secrets.TILLER_RELEASE_APP_PRIVATE_KEY }}
          owner: paperwing-dev
          repositories: tiller

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.release-app-token.outputs.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install release dependencies
        run: npm ci

      - name: Release
        env:
          TILLER_RELEASE_BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run release -- --bump "$TILLER_RELEASE_BUMP"
